services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ollama-init:
    image: curlimages/curl:8.5.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      LLAMA_MODEL: ${LLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling model $$LLAMA_MODEL on ollama service..."
        curl -sf http://ollama:11434/api/pull \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$$LLAMA_MODEL\",\"stream\":false}"
        echo
        echo "Model ready."
    restart: "no"

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      LLAMA_BASE_URL: http://ollama:11434/v1
      LLAMA_MODEL: ${LLAMA_MODEL:-qwen2.5:3b}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-not-needed}
      EVAL_LLM_MODEL: ${EVAL_LLM_MODEL:-qwen2.5:3b}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-docrag}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    command:
      [
        "streamlit",
        "run",
        "streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--browser.gatherUsageStats=false",
      ]

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      LLAMA_BASE_URL: http://ollama:11434/v1
      LLAMA_MODEL: ${LLAMA_MODEL:-qwen2.5:3b}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-not-needed}
      EVAL_LLM_MODEL: ${EVAL_LLM_MODEL:-qwen2.5:3b}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-docrag}
      PORT: "5000"
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    command:
      ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5000"]

volumes:
  ollama_models:
  hf_cache:
